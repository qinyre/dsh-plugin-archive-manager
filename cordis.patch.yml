# dsh-plugin-archive-manager bundle patch: insert the plugin into a profile's layer
# stack. The node half registers /dsh-plugin-archive-manager/* routes on the web server
# (archive list / preview / unarchive / auto-archive rules); the client half
# contributes the Settings archive-management section.
- insert:
    - id: dsh-plugin-archive-manager
      name: 'dsh-plugin-archive-manager'
